<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aoyagi design — blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Lora:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #34537D;
            --taupe: #B0AC90;
            --cream: #FAF7F1;
            --text: #2a2a2a;
        }

        html, body {
            background: linear-gradient(135deg, var(--cream) 0%, rgba(176, 172, 144, 0.05) 100%);
            color: var(--text);
            font-family: "Shippori Mincho B1", serif;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* ===== Header ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(250, 247, 241, 0.98) 0%, rgba(250, 247, 241, 0.95) 100%);
            border-bottom: 1px solid rgba(176, 172, 144, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(52, 83, 125, 0.05);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--navy);
            text-decoration: none;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--taupe);
            border-radius: 50%;
        }

        .header-nav {
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            font-family: "Zen Kaku Gothic New", sans-serif;
        }

        .header-nav a {
            color: var(--taupe);
            text-decoration: none;
            transition: color 0.3s;
        }

        .header-nav a:hover {
            color: var(--navy);
        }

        /* ===== Main Layout ===== */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* ===== Hero Section ===== */
        .hero {
            margin-bottom: 4rem;
            padding: 2.5rem;
            background: linear-gradient(135deg, rgba(52, 83, 125, 0.08) 0%, rgba(176, 172, 144, 0.08) 100%);
            border-radius: 12px;
            border: 1px solid rgba(176, 172, 144, 0.2);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-label {
            font-family: "Space Mono", monospace;
            font-size: 0.7rem;
            color: var(--taupe);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .hero-title {
            font-family: "Shippori Mincho B1", serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.8rem;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 1.2rem;
            opacity: 0.85;
        }

        .hero-meta {
            display: flex;
            gap: 2rem;
            font-family: "Space Mono", monospace;
            font-size: 0.75rem;
            color: var(--taupe);
            letter-spacing: 0.02em;
        }

        /* ===== Content Grid ===== */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 3rem;
        }

        /* ===== Sidebar Left (List) ===== */
        .article-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar-section {
            padding: 2rem;
            background: rgba(250, 247, 241, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(176, 172, 144, 0.15);
        }

        .sidebar-title {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 1.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .article-list {
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .article-list::-webkit-scrollbar {
            width: 5px;
        }

        .article-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .article-list::-webkit-scrollbar-thumb {
            background: var(--taupe);
            border-radius: 3px;
        }

        .article-item {
            cursor: pointer;
            padding: 0.8rem;
            border-radius: 6px;
            transition: all 0.3s;
            background: transparent;
            border: 1px solid transparent;
        }

        .article-item:hover {
            background: rgba(52, 83, 125, 0.06);
            border-color: var(--taupe);
        }

        .article-item.active {
            background: rgba(52, 83, 125, 0.12);
            border-color: var(--navy);
        }

        .article-date {
            display: block;
            font-family: "Space Mono", monospace;
            font-size: 0.7rem;
            color: var(--taupe);
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }

        .article-name {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--navy);
            line-height: 1.3;
        }

        /* ===== Tag Cloud ===== */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            background: rgba(52, 83, 125, 0.08);
            border: 1px solid rgba(52, 83, 125, 0.2);
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: "Space Mono", monospace;
            color: var(--navy);
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag:hover {
            background: rgba(52, 83, 125, 0.15);
            border-color: var(--navy);
        }

        .tag.active {
            background: var(--navy);
            border-color: var(--navy);
            color: #fff;
        }

        /* ===== Stats ===== */
        .stats {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--taupe);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ===== Main Content ===== */
        .article-view {
            min-height: 60vh;
            padding: 2rem;
            background: rgba(250, 247, 241, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(176, 172, 144, 0.15);
        }

        .article-header {
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(176, 172, 144, 0.2);
        }

        .article-meta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-family: "Space Mono", monospace;
            font-size: 0.75rem;
            color: var(--taupe);
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .article-meta-tag {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            background: rgba(176, 172, 144, 0.15);
            border-radius: 4px;
        }

        .article-title {
            font-family: "Shippori Mincho B1", serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .article-body {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
        }

        .article-body h2 {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--navy);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(176, 172, 144, 0.2);
        }

        .article-body h3 {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--taupe);
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
        }

        .article-body p {
            margin-bottom: 1.2rem;
        }

        .article-body ul, .article-body ol {
            margin: 1.2rem 0 1.2rem 2rem;
        }

        .article-body li {
            margin-bottom: 0.5rem;
        }

        .article-body a {
            color: var(--navy);
            text-decoration: underline;
            transition: color 0.3s;
        }

        .article-body a:hover {
            color: var(--taupe);
        }

        .article-body code {
            font-family: "Space Mono", monospace;
            background: rgba(52, 83, 125, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            font-size: 0.9em;
            color: var(--navy);
        }

        .article-body pre {
            background: rgba(52, 83, 125, 0.08);
            padding: 1.2rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border-left: 3px solid var(--taupe);
        }

        .article-body pre code {
            background: none;
            padding: 0;
            color: var(--text);
            font-size: 0.85em;
        }

        .article-body blockquote {
            border-left: 3px solid var(--taupe);
            padding-left: 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--taupe);
        }

        .empty-state {
            text-align: center;
            color: var(--taupe);
            padding: 3rem 1rem;
            font-style: italic;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .article-list {
                max-height: none;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .article-item {
                flex: 0 1 calc(50% - 0.4rem);
            }

            .header-title {
                font-size: 1.1rem;
            }

            .header-nav {
                font-size: 0.8rem;
                gap: 1rem;
            }

            .article-title {
                font-size: 1.5rem;
            }

            .hero-title {
                font-size: 1.8rem;
            }

            main {
                padding: 2rem 1rem;
            }

            .hero {
                padding: 1.5rem;
            }

            .sidebar-section {
                padding: 1.5rem;
            }

            .article-view {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="#" class="header-title">aoyagi blog</a>
            <nav class="header-nav">
                <a href="https://aoyagi-design.com" target="_blank">portfolio</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- ===== Hero Section ===== -->
        <section class="hero" id="heroSection">
            <div class="hero-label">Latest</div>
            <h2 class="hero-title" id="heroTitle">記事を選択してください</h2>
            <div class="hero-meta">
                <span id="heroDate"></span>
                <span id="heroStats"></span>
            </div>
        </section>

        <!-- ===== Main Content Grid ===== -->
        <div class="container">
            <!-- Left Sidebar: List -->
            <aside class="article-list-wrapper">
                <div class="sidebar-section">
                    <div class="sidebar-title">記事一覧</div>
                    <div class="article-list" id="articleList"></div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">タグ</div>
                    <div class="tag-cloud" id="tagCloud"></div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">統計</div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-number" id="statCount">0</div>
                            <div class="stat-label">Posts</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="statTags">0</div>
                            <div class="stat-label">Tags</div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <article class="article-view">
                <div class="empty-state">記事を選択してください</div>
            </article>
        </div>
    </main>

    <script>
        // ===== 記事データはarticles.json、タグ名はtags.jsonから読み込む =====
        let articles = [];
        let tagNameMap = {}; // id -> 表示名
        let activeTag = null; // クリックで選択中のタグID（nullなら全件表示）

        const articleView = document.querySelector('.article-view');
        const listContainer = document.getElementById('articleList');
        const tagCloud = document.getElementById('tagCloud');
        let currentArticleId = null;

        function tagLabel(tagId) {
            return tagNameMap[tagId] || tagId;
        }

        // ===== Render Functions =====
        function renderList() {
            const visible = activeTag
                ? articles.filter(a => a.tags.includes(activeTag))
                : articles;

            listContainer.innerHTML = visible
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .map(article => `
                    <div class="article-item" data-id="${article.id}">
                        <span class="article-date">${formatDate(article.date)}</span>
                        <span class="article-name">${article.title}</span>
                    </div>
                `).join('') || `<div class="empty-state" style="padding:1rem 0;">該当する記事がありません</div>`;

            document.querySelectorAll('.article-item').forEach(item => {
                item.addEventListener('click', () => loadArticle(item.dataset.id));
            });

            const allTags = new Set();
            articles.forEach(a => a.tags.forEach(t => allTags.add(t)));
            document.getElementById('statCount').textContent = articles.length;
            document.getElementById('statTags').textContent = allTags.size;

            if (visible.length > 0 && (!currentArticleId || !visible.some(a => a.id === currentArticleId))) {
                loadArticle(visible.sort((a, b) => new Date(b.date) - new Date(a.date))[0].id);
            }
        }

        function renderTagCloud() {
            const tagMap = {};
            articles.forEach(article => {
                article.tags.forEach(tag => {
                    tagMap[tag] = (tagMap[tag] || 0) + 1;
                });
            });

            const sectionTitle = document.querySelector('#tagCloud').closest('.sidebar-section').querySelector('.sidebar-title');
            sectionTitle.innerHTML = activeTag
                ? `タグ <span style="font-weight:400; text-transform:none; letter-spacing:0; cursor:pointer; color:var(--navy);" id="clearTagFilter">（絞り込み解除 ×）</span>`
                : 'タグ';

            tagCloud.innerHTML = Object.entries(tagMap)
                .map(([tag, count]) => `
                    <span class="tag${tag === activeTag ? ' active' : ''}" data-tag="${tag}" title="${count}件">${tagLabel(tag)}</span>
                `).join('');

            document.querySelectorAll('.tag[data-tag]').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    activeTag = activeTag === tag ? null : tag;
                    renderTagCloud();
                    renderList();
                });
            });

            const clearBtn = document.getElementById('clearTagFilter');
            if (clearBtn) {
                clearBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeTag = null;
                    renderTagCloud();
                    renderList();
                });
            }
        }

        async function loadArticle(articleId) {
            const article = articles.find(a => a.id === articleId);
            if (!article) return;

            currentArticleId = articleId;

            document.querySelectorAll('.article-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-id="${articleId}"]`).classList.add('active');

            try {
                const response = await fetch(article.file);
                if (!response.ok) throw new Error('Not found');
                const markdown = await response.text();

                const html = marked.parse(markdown);
                const tagsHTML = article.tags.map(tag => `<span class="article-meta-tag" data-tag="${tag}" style="cursor:pointer;">${tagLabel(tag)}</span>`).join('');

                articleView.innerHTML = `
                    <div class="article-header">
                        <div class="article-meta">
                            <span>${formatDate(article.date)}</span>
                            ${tagsHTML}
                        </div>
                        <h1 class="article-title">${article.title}</h1>
                    </div>
                    <div class="article-body">${html}</div>
                `;

                document.querySelectorAll('.article-meta-tag[data-tag]').forEach(el => {
                    el.addEventListener('click', () => {
                        const tag = el.dataset.tag;
                        activeTag = activeTag === tag ? null : tag;
                        renderTagCloud();
                        renderList();
                    });
                });

                updateHero(article);
            } catch (error) {
                articleView.innerHTML = `<div class="empty-state">記事の読み込みに失敗しました<br><span style="font-family:'Space Mono',monospace; font-size:0.7rem; color:var(--taupe);">探した場所: ${article.file}</span></div>`;
                console.error('記事の読み込みに失敗:', article.file, error);
            }
        }

        function updateHero(article) {
            document.getElementById('heroTitle').textContent = article.title;
            document.getElementById('heroDate').textContent = formatDate(article.date);
            const tagCount = article.tags.length;
            document.getElementById('heroStats').textContent = `${tagCount} tag${tagCount !== 1 ? 's' : ''}`;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        // ===== 初期化 =====
        async function init() {
            try {
                const tagsRes = await fetch('tags.json');
                if (tagsRes.ok) {
                    const tagList = await tagsRes.json();
                    tagList.forEach(t => { tagNameMap[t.id] = t.name; });
                }
            } catch (error) {
                console.log('tags.jsonが見つかりません。タグIDをそのまま表示します。');
            }

            try {
                const response = await fetch('articles.json');
                if (response.ok) {
                    articles = await response.json();
                }
            } catch (error) {
                console.log('articles.jsonが見つかりません。デフォルト記事を読み込みます。');
                // フォールバック：デフォルト記事
                articles = [
                    {
                        id: 'intro-aoyagi',
                        title: 'aoyagi designについて',
                        date: '2026-08-09',
                        tags: ['intro', 'design'],
                        file: 'articles/intro-aoyagi.md'
                    },
                    {
                        id: 'android-dev-2026',
                        title: 'Kotlin + Jetpack Composeで構築する2026年のAndroidアプリ',
                        date: '2026-08-05',
                        tags: ['android', 'kotlin'],
                        file: 'articles/android-dev-2026.md'
                    },
                    {
                        id: 'generative-art',
                        title: 'Pythonで生成アート — Liquid Glass Wallpapers',
                        date: '2026-07-30',
                        tags: ['python', 'generative art'],
                        file: 'articles/generative-art.md'
                    }
                ];
            }
            
            renderTagCloud();
            renderList(); // 最新記事の自動読み込みはrenderList内で行う
        }

        init();
    </script>
</body>
</html>
